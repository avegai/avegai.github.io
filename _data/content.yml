# ---- About ----
about_lead: "Ten-plus years of music production and sound design experience, from turning client briefs into interactive audio and haptic experiences, to album mixes, sample pack making and creative coding."
about:
  - "I work alongside creative teams, research where an experience actually breaks down for users, and turn those findings into both better sound design and the strategy around a release; a client advisor rather than an executor of briefs."
  - "Currently designing bespoke tracks, UX/UI sounds and haptic feedback, soundscapes and sonic logos at amp Sound Branding in Munich, and running the nu.wav label."

