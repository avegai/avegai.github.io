media:
  input: assets
  output: /assets

content:
  - name: site
    label: Site text
    type: file
    path: _data/content.yml
    fields:
      # ---- Browser tab, Google and link previews ----
      - name: page_title
        label: Page title
        type: string
        description: Shown in the browser tab and on Google.
      - name: share_title
        label: Share title
        type: string
        description: Title shown when the link is shared (WhatsApp, LinkedIn, Slack…).
      - name: description
        label: Short description
        type: text
        description: One or two sentences for Google and link previews.

      # ---- Top of the page ----
      - name: headline
        label: Headline
        type: text
        description: The big sentence at the top of the page.
      - name: reel_label
        label: Reel label
        type: string
        description: Small text above the reel player, e.g. "composer reel".
      - name: reel_audio
        label: Reel audio
        type: file
        description: MP3 for the reel player. Leave empty to hide the player.
        options:
          categories: [audio]
      - name: clients
        label: Clients under the reel
        type: string
        list: true

      # ---- Menu ----
      - name: menu_note
        label: Menu note
        type: text
        description: The line at the bottom of the open menu.

      # ---- About ----
      - name: about_lead
        label: About, big line
        type: text
        description: "The larger sentence on the left. You can add links like [nu.wav](https://nuwavlab.com)."
      - name: about
        label: About, paragraphs
        type: text
        description: "The paragraphs on the right. You can add links like [nu.wav](https://nuwavlab.com) and *italics*."
        list: true

      # ---- Disciplines ----
      - name: disciplines
        label: Disciplines
        type: object
        list:
          collapsible:
            summary: "{fields.name}"
        fields:
          - name: name
            label: Name
            type: string
          - name: description
            label: Description
            type: text
          - name: loop
            label: Loop audio
            type: file
            description: Short MP3 loop. The play button stays hidden until there is a file.
            options:
              categories: [audio]

      # ---- Work ----
      - name: work
        label: Work
        type: object
        description: Drag to reorder. The first project is shown at the top.
        list:
          collapsible:
            summary: "{fields.title}"
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: year
            label: Year
            type: string
            description: Free text, e.g. "2022—" or "Feb 2026". Leave empty to hide.
          - name: client
            label: Client / context
            type: string
          - name: description
            label: Description
            type: text
          - name: categories
            label: Categories
            type: select
            description: Used by the filter buttons above the list.
            options:
              multiple: true
              values:
                - name: branding
                  label: Sonic Branding
                - name: ux
                  label: UX/UI Sound
                - name: score
                  label: Score & Film
                - name: packs
                  label: Sample Packs
                - name: art
                  label: Sound Art
                - name: code
                  label: Creative Coding
          - name: link
            label: Link
            type: string
            description: Where the title links to. A full https:// address, or /work/… for a page on this site. Leave empty for no link.
          - name: video
            label: YouTube video
            type: string
            description: Paste any YouTube link. The title then opens the video on the page.
          - name: video_label
            label: Video button text
            type: string
            description: Text on the small video tag, e.g. "demo reel". Defaults to "video".
          - name: audio
            label: Audio clip
            type: file
            description: MP3 for the play button on the right. Hidden until there is a file.
            options:
              categories: [audio]
          - name: pattern
            label: Thumbnail pattern
            type: select
            description: The small generative drawing on the left.
            options:
              values: [bands, dots, bars, grains, wave, spectro, rings]

      # ---- Contact ----
      - name: contact_line
        label: Contact line
        type: string
        description: The big line at the bottom. Clicking it opens an email to the address below.
      - name: email
        label: Email
        type: string
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: url
            label: Address
            type: string
